<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    .label { font-weight: 600; }
    .status-error { color: #a40000; }
    .status-review { color: #8a5a00; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit" id="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite">
    <p id="status" role="status"></p>
    <div id="topic-row" hidden>
      <span class="label">Тема:</span> <span id="topic"></span>
    </div>
    <div id="draft-row" hidden>
      <span class="label">Черновик ответа:</span>
      <pre id="draft"></pre>
    </div>
  </section>
  <script type="module">
    const TOPIC_LABELS = {
      delivery: "Доставка",
      pricing: "Цены",
      other: "Другое",
    };

    const form = document.querySelector("form");
    const submit = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const topicRow = document.querySelector("#topic-row");
    const topic = document.querySelector("#topic");
    const draftRow = document.querySelector("#draft-row");
    const draft = document.querySelector("#draft");

    function clearResult() {
      status.textContent = "";
      status.className = "";
      topic.textContent = "";
      topicRow.hidden = true;
      draft.textContent = "";
      draftRow.hidden = true;
    }

    function showMessage(message, className) {
      status.textContent = message;
      status.className = className;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      submit.disabled = true;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();

        if (reply.ok && data.status === "ready") {
          showMessage("Заявка разобрана. Проверьте черновик перед отправкой.", "");
          topic.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
          topicRow.hidden = false;
          draft.textContent = data.draft;
          draftRow.hidden = false;
          return;
        }

        if (data.status === "manual_review") {
          showMessage(
            "Не удалось автоматически разобрать заявку. Проверьте её и подготовьте ответ вручную.",
            "status-review",
          );
          return;
        }

        if (data.status === "invalid_input") {
          showMessage("Введите текст заявки.", "status-error");
          return;
        }

        showMessage("Не удалось получить ответ. Попробуйте ещё раз.", "status-error");
      } catch {
        showMessage("Ошибка сети. Проверьте подключение и попробуйте ещё раз.", "status-error");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
